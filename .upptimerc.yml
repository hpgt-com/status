# Upptime (https://upptime.js.org): sjekker sidene hvert 5. minutt fra GitHub Actions, og publiserer statussiden på
# https://status.hpgt.com (GitHub Pages, branchen gh-pages). Går noe ned, lages en sak i dette repoet; den lukkes når det
# er oppe igjen. Kjører hos GitHub, ikke hos Cloudflare der sidene ligger, så den virker også når Cloudflare er nede.
# Endres med en pull request. Workflowene er våre egne (.github/workflows), ikke Upptimes mal: se README.
owner: hpgt-com
repo: status

sites:
  - name: hpgt.com
    slug: hpgt-com
    url: https://hpgt.com/
  - name: Skjemaene på hpgt.com
    slug: skjemaer
    # Workeren svarer 405 på GET (skjemaene tar bare imot POST). 405 betyr altså at den kjører.
    url: https://hpgt.com/api/radioid
    expectedStatusCodes:
      - 405
  - name: flysteder.hpgt.com
    slug: flysteder
    url: https://flysteder.hpgt.com/
  - name: Datatjenesten for flysteder
    slug: datatjenesten
    # Oppe = svarer, og melder selv at dataene er ferske («ok»: true i status.json)
    url: https://data.hpgt.com/v1/status.json
    __dangerous__body_down_if_text_missing: '"ok":true'

status-website:
  cname: status.hpgt.com
  logoUrl: https://hpgt.com/assets/img/hpgt-logo.png
  favicon: https://hpgt.com/favicon.ico
  name: HPGT driftsstatus
  introTitle: "Driftsstatus for hpgt.com og flysteder.hpgt.com"
  introMessage: "Sidene sjekkes hvert 5. minutt. Sjekken kjører hos GitHub, uavhengig av Cloudflare der sidene ligger. Ser du en feil som ikke står her, kan du [melde fra](https://hpgt.com/meld-feil/)."
  navbar:
    - title: Status
      href: /
    - title: hpgt.com
      href: https://hpgt.com/
    - title: Flysteder
      href: https://flysteder.hpgt.com/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
